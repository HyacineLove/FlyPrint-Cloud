services:
  sso-login-demo:
    build:
      context: ../sso-login-demo
      dockerfile: Dockerfile
      args:
        - DOCKERHUB_MIRROR=${DOCKERHUB_MIRROR:-docker.1ms.run}
    environment:
      SSO_DATA_FILE: /data/state.json
      SSO_OPERATOR_USERNAME: ${SSO_OPERATOR_USERNAME:?set in .env}
      SSO_OPERATOR_PASSWORD: ${SSO_OPERATOR_PASSWORD:?set in .env}
      SSO_CLIENT_SECRET: ${SITE_PORTAL_IDENTITY_CLIENT_SECRET:?set in .env}
      SSO_ALLOWED_REDIRECT_URIS: ${SITE_PORTAL_PUBLIC_BASE_URL:?set in .env}/auth/callback
      SSO_PRP_TOKEN_SECRET: ${PRP_TOKEN_SECRET:?set in .env}
      SSO_PRP_TOKEN_ISSUER: flyprint-sso-demo
      SSO_PRP_TOKEN_AUDIENCE: flyprint-prp-demo
      SSO_SITE_PORTAL_CODE: ${SITE_PORTAL_CODE:?set in .env}
      SSO_PORT: 8080
    ports:
      - "${SSO_DEMO_PORT:-8081}:8080"
    volumes:
      - sso_login_demo_data:/data
    networks: [site-portal-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prp-demo:
    build:
      context: ../prp-demo
      dockerfile: Dockerfile
    environment:
      PRP_DATA_DIR: /data
      PRP_DATABASE_FILE: /data/prp.db
      PRP_TOKEN_SECRET: ${PRP_TOKEN_SECRET:?set in .env}
      PRP_TOKEN_ISSUER: flyprint-sso-demo
      PRP_TOKEN_AUDIENCE: flyprint-prp-demo
      PRP_SITE_PORTAL_CODE: ${SITE_PORTAL_CODE:?set in .env}
      PRP_ALLOWED_UPLOAD_ORIGINS: ${SITE_PORTAL_PUBLIC_BASE_URL:?set in .env}
      PRP_PUBLIC_BASE_URL: ${PRP_PUBLIC_BASE_URL:?set in .env}
      PRP_MAX_FILE_SIZE_BYTES: ${PRP_MAX_FILE_SIZE_BYTES:-52428800}
      PRP_MAX_FILES_PER_USER: ${PRP_MAX_FILES_PER_USER:-20}
      PRP_MAX_BYTES_PER_USER: ${PRP_MAX_BYTES_PER_USER:-209715200}
      PRP_MAX_TOTAL_BYTES: ${PRP_MAX_TOTAL_BYTES:-1073741824}
      PRP_FILE_TTL_SECONDS: ${PRP_FILE_TTL_SECONDS:-604800}
      PRP_CLEANUP_INTERVAL_SECONDS: ${PRP_CLEANUP_INTERVAL_SECONDS:-300}
      PRP_PORT: 8080
    ports:
      - "${PRP_DEMO_PORT:-8083}:8080"
    volumes:
      - prp_demo_data:/data
    networks: [site-portal-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  site-portal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DOCKERHUB_MIRROR=${DOCKERHUB_MIRROR:-docker.1ms.run}
    environment:
      SITE_PORTAL_CODE: ${SITE_PORTAL_CODE:?set in .env}
      SITE_PORTAL_DISPLAY_NAME: ${SITE_PORTAL_DISPLAY_NAME:?set in .env}
      SITE_PORTAL_CLOUD_API_BASE: ${SITE_PORTAL_CLOUD_API_BASE:?set in .env}
      SITE_PORTAL_CLOUD_CLIENT_ID: ${SITE_PORTAL_CLOUD_CLIENT_ID:?set in .env}
      SITE_PORTAL_CLOUD_CLIENT_SECRET: ${SITE_PORTAL_CLOUD_CLIENT_SECRET:?set in .env}
      SITE_PORTAL_IDENTITY_BROWSER_BASE_URL: ${SSO_DEMO_PUBLIC_BASE_URL:?set in .env}
      SITE_PORTAL_IDENTITY_API_BASE_URL: http://sso-login-demo:8080
      SITE_PORTAL_IDENTITY_CLIENT_SECRET: ${SITE_PORTAL_IDENTITY_CLIENT_SECRET:?set in .env}
      SITE_PORTAL_IDENTITY_CALLBACK_URL: ${SITE_PORTAL_PUBLIC_BASE_URL:?set in .env}/auth/callback
      SITE_PORTAL_PRP_BASE_URL: ${PRP_PUBLIC_BASE_URL:?set in .env}
      SITE_PORTAL_UPLOAD_ENABLED: "true"
      SITE_PORTAL_PRP_API_BASE_URL: http://prp-demo:8080
      SITE_PORTAL_USER_SESSION_TTL: ${SITE_PORTAL_USER_SESSION_TTL:-1h}
      SITE_PORTAL_COOKIE_SECURE: ${SITE_PORTAL_COOKIE_SECURE:-false}
      SITE_PORTAL_PORT: 8080
    ports:
      - "${SITE_PORTAL_PORT:-8082}:8080"
    depends_on:
      sso-login-demo:
        condition: service_healthy
      prp-demo:
        condition: service_healthy
    networks: [site-portal-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  sso_login_demo_data:
    # Set SITE_PORTAL_SSO_DATA_VOLUME when adopting an existing local SSO volume.
    name: ${SITE_PORTAL_SSO_DATA_VOLUME:-fly-print-site-portal_sso_login_demo_data}
    external: ${SITE_PORTAL_DATA_VOLUME_EXTERNAL:-false}
  prp_demo_data:
    # Set SITE_PORTAL_PRP_DATA_VOLUME when adopting an existing local PRP volume.
    name: ${SITE_PORTAL_PRP_DATA_VOLUME:-fly-print-site-portal_prp_demo_data}
    external: ${SITE_PORTAL_DATA_VOLUME_EXTERNAL:-false}

networks:
  site-portal-network:
    driver: bridge
