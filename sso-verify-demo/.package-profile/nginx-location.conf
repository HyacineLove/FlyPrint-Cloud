# Include this location block inside the existing UAT server listening on 8082.
# The outer HTTPS gateway remains responsible for TLS termination.
location = /fly-print-site-portal {
    return 308 /fly-print-site-portal/;
}

location ^~ /fly-print-site-portal/ {
    proxy_pass http://127.0.0.1:18090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}
