services:
  postgres:
    image: postgres:15.13
    container_name: fly-print-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fly-print-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  minio:
    image: ${MINIO_IMAGE_MIRROR:-quay.io}/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: fly-print-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    volumes:
      - minio_data:/data
    networks:
      - fly-print-network
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/.minio.sys/format.json"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  minio-init:
    image: ${MINIO_IMAGE_MIRROR:-quay.io}/minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: fly-print-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set} ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set} &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-fly-print-files} &&
        mc mb --ignore-existing local/fly-print-session-files &&
        (mc admin user info local ${SESSION_FILE_MINIO_ACCESS_KEY:?SESSION_FILE_MINIO_ACCESS_KEY must be set} >/dev/null 2>&1 || mc admin user add local ${SESSION_FILE_MINIO_ACCESS_KEY:?SESSION_FILE_MINIO_ACCESS_KEY must be set} ${SESSION_FILE_MINIO_SECRET_KEY:?SESSION_FILE_MINIO_SECRET_KEY must be set}) &&
        (mc admin policy info local flyprint-session-files >/dev/null 2>&1 || mc admin policy create local flyprint-session-files /config/session-file-minio-policy.json) &&
        mc admin policy attach local flyprint-session-files --user ${SESSION_FILE_MINIO_ACCESS_KEY:?SESSION_FILE_MINIO_ACCESS_KEY must be set}
    volumes:
      - ./deploy/session-file-minio-policy.json:/config/session-file-minio-policy.json:ro
    networks:
      - fly-print-network
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - DOCKERHUB_MIRROR=${DOCKERHUB_MIRROR:-docker.1ms.run}
        - GOPROXY=https://goproxy.cn,direct
    container_name: fly-print-api
    environment:
      - FLY_PRINT_APP_ENVIRONMENT=${APP_ENVIRONMENT:-development}
      - FLY_PRINT_APP_DEBUG=${APP_DEBUG:-true}
      - FLY_PRINT_DATABASE_HOST=postgres
      - FLY_PRINT_DATABASE_PORT=5432
      - FLY_PRINT_DATABASE_DBNAME=${POSTGRES_DB:?POSTGRES_DB must be set}
      - FLY_PRINT_DATABASE_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - FLY_PRINT_DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - FLY_PRINT_SERVER_ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
      - FLY_PRINT_SERVER_TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - FLY_PRINT_SERVER_PUBLIC_BASE_URL=${EXTERNAL_API_URL:?EXTERNAL_API_URL must be set}
      - FLY_PRINT_CREATE_DEFAULT_ADMIN=${CREATE_DEFAULT_ADMIN:-false}
      - FLY_PRINT_DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD must be set}
      - FLY_PRINT_OAUTH2_MODE=${OAUTH2_MODE:-builtin}
      - FLY_PRINT_OAUTH2_JWT_SIGNING_SECRET=${OAUTH2_JWT_SIGNING_SECRET:?OAUTH2_JWT_SIGNING_SECRET must be set}
      - FLY_PRINT_OAUTH2_JWT_TOKEN_EXPIRY=${OAUTH2_JWT_TOKEN_EXPIRY:-3600}
      - FLY_PRINT_OAUTH2_JWT_ISSUER=${OAUTH2_JWT_ISSUER:-fly-print-cloud}
      - FLY_PRINT_OAUTH2_CLIENT_ID=${OAUTH2_CLIENT_ID}
      - FLY_PRINT_OAUTH2_CLIENT_SECRET=${OAUTH2_CLIENT_SECRET}
      - FLY_PRINT_OAUTH2_AUTH_URL=${OAUTH2_AUTH_URL}
      - FLY_PRINT_OAUTH2_TOKEN_URL=${OAUTH2_TOKEN_URL}
      - FLY_PRINT_OAUTH2_REDIRECT_URI=${OAUTH2_REDIRECT_URI:-}
      - FLY_PRINT_OAUTH2_USERINFO_URL=${OAUTH2_USERINFO_URL}
      - FLY_PRINT_OAUTH2_LOGOUT_URL=${OAUTH2_LOGOUT_URL}
      - FLY_PRINT_OAUTH2_LOGOUT_REDIRECT_URI_PARAM=${OAUTH2_LOGOUT_REDIRECT_URI_PARAM:-post_logout_redirect_uri}
      - FLY_PRINT_ADMIN_CONSOLE_URL=${ADMIN_CONSOLE_URL:?ADMIN_CONSOLE_URL must be set}
      - FLY_PRINT_STORAGE_PROVIDER=${STORAGE_PROVIDER:-minio}
      - FLY_PRINT_STORAGE_DOWNLOAD_MODE=${STORAGE_DOWNLOAD_MODE:-proxy}
      - FLY_PRINT_STORAGE_MAX_SIZE=${STORAGE_MAX_SIZE:-10485760}
      - FLY_PRINT_STORAGE_MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - FLY_PRINT_STORAGE_MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      - FLY_PRINT_STORAGE_MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      - FLY_PRINT_STORAGE_MINIO_BUCKET=${MINIO_BUCKET:-fly-print-files}
      - FLY_PRINT_STORAGE_MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - FLY_PRINT_STORAGE_MINIO_OBJECT_PREFIX=${MINIO_OBJECT_PREFIX:-}
      - FLY_PRINT_SECURITY_FILE_ACCESS_SECRET=${FILE_ACCESS_SECRET:?FILE_ACCESS_SECRET must be set}
      - FLY_PRINT_SECURITY_OAUTH_CLIENT_SECRET_ENCRYPTION_KEY=${OAUTH_CLIENT_SECRET_ENCRYPTION_KEY:?OAUTH_CLIENT_SECRET_ENCRYPTION_KEY must be set}
      - FLY_PRINT_SECURITY_UPLOAD_TOKEN_TTL=${UPLOAD_TOKEN_TTL:-300}
      - FLY_PRINT_SECURITY_DOWNLOAD_TOKEN_TTL=${DOWNLOAD_TOKEN_TTL:-300}
      - FLY_PRINT_SECURITY_ENTRY_COOKIE_SECURE=${ENTRY_COOKIE_SECURE:-true}
      - FLY_PRINT_SECURITY_INSECURE_HTTP_MODE=${INSECURE_HTTP_MODE:-false}
      - FLY_PRINT_SECURITY_INSECURE_HTTP_UNTIL=${INSECURE_HTTP_UNTIL:-}
      - FLY_PRINT_STORAGE_UPLOAD_DIR=/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - file_uploads:/app/uploads
    user: "10001:10001"
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "2.0"
    mem_limit: 1g
    pids_limit: 256
    networks:
      - fly-print-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  session-file-service:
    image: ${SESSION_FILE_SERVICE_IMAGE:-flyprint/session-file-service:dev}
    build:
      context: ./services/session-file-service
      dockerfile: Dockerfile
      args:
        DOCKERHUB_MIRROR: ${DOCKERHUB_MIRROR:-docker.1ms.run}
    environment:
      SESSION_FILE_LISTEN_PORT: 8080
      SESSION_FILE_SIGN_SECRET: ${SESSION_FILE_SIGN_SECRET:?SESSION_FILE_SIGN_SECRET must be set}
      SESSION_FILE_ALLOWED_CIDRS: ${SESSION_FILE_ALLOWED_CIDRS:?SESSION_FILE_ALLOWED_CIDRS must be set}
      SESSION_FILE_TRUSTED_PROXY_CIDRS: ${SESSION_FILE_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      SESSION_FILE_MAX_TTL: ${SESSION_FILE_MAX_TTL:-1h}
      SESSION_FILE_SWEEP_INTERVAL: ${SESSION_FILE_SWEEP_INTERVAL:-1m}
      SESSION_FILE_MAX_FILE_SIZE: ${SESSION_FILE_MAX_FILE_SIZE:-20971520}
      SESSION_FILE_MAX_FILES: ${SESSION_FILE_MAX_FILES:-10}
      SESSION_FILE_MAX_TOTAL_BYTES: ${SESSION_FILE_MAX_TOTAL_BYTES:-83886080}
      SESSION_FILE_MINIO_ENDPOINT: minio:9000
      SESSION_FILE_MINIO_ACCESS_KEY: ${SESSION_FILE_MINIO_ACCESS_KEY:?SESSION_FILE_MINIO_ACCESS_KEY must be set}
      SESSION_FILE_MINIO_SECRET_KEY: ${SESSION_FILE_MINIO_SECRET_KEY:?SESSION_FILE_MINIO_SECRET_KEY must be set}
      SESSION_FILE_MINIO_BUCKET: fly-print-session-files
      SESSION_FILE_MINIO_USE_SSL: "false"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - fly-print-network
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=32m"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "1.0"
    mem_limit: 256m
    pids_limit: 128
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  admin-console-builder:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - DOCKERHUB_MIRROR=${DOCKERHUB_MIRROR:-docker.1ms.run}
        - REACT_APP_API_BASE_PATH=${REACT_APP_API_BASE_PATH:-}
        - REACT_APP_AUTH_BASE_PATH=${REACT_APP_AUTH_BASE_PATH:-}
        - REACT_APP_API_URL=${REACT_APP_API_URL:-}
        - REACT_APP_BASENAME=${REACT_APP_BASENAME:-}
        - PUBLIC_URL=${PUBLIC_URL:-}
    container_name: fly-print-admin-builder
    volumes:
      - admin_build:/app/build
    restart: "no"
    networks:
      - fly-print-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  nginx:
    image: nginx:1.27-alpine
    container_name: fly-print-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - certbot_webroot:/var/www/certbot:ro
      - admin_build:/usr/share/nginx/html
    depends_on:
      - api
      - admin-console-builder
      - session-file-service
    networks:
      - fly-print-network
    read_only: true
    tmpfs:
      - "/var/cache/nginx:rw,noexec,nosuid,size=64m"
      - "/var/run:rw,noexec,nosuid,size=8m"
      - "/tmp:rw,noexec,nosuid,size=16m"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    cpus: "1.0"
    mem_limit: 256m
    pids_limit: 128
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:
  admin_build:
  file_uploads:
  minio_data:
  certbot_webroot:
  certbot_conf:

networks:
  fly-print-network:
    driver: bridge
