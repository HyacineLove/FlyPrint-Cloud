location = /health {
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /entry {
    limit_req zone=entry_limit burst=20 nodelay;
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /entry/options {
    limit_req zone=entry_limit burst=20 nodelay;
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
}

location = /auth/token {
    limit_req zone=auth_limit burst=3 nodelay;
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /auth/ {
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
}

location = /api/v1/edge/ws {
    limit_req zone=ws_limit burst=5 nodelay;
    limit_conn per_ip_conn 20;
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_send_timeout 15s;
}

location = /api/v1/edge/activate {
    limit_req zone=activation_limit burst=2 nodelay;
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /internal/session-files/ {
    limit_req zone=file_limit burst=4 nodelay;
    limit_conn per_ip_conn 2;
    client_max_body_size 22m;
    set $session_file_upstream session-file-service:8080;
    rewrite ^/internal/session-files/(.*)$ /$1 break;
    proxy_pass http://$session_file_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering on;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

location ^~ /api/v1/public/terminal-entry/ {
    limit_req zone=entry_limit burst=20 nodelay;
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
}

location ^~ /api/v1/files/ {
    limit_req zone=file_limit burst=4 nodelay;
    limit_conn per_ip_conn 2;
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
}

location = /api/v1/files {
    limit_req zone=file_limit burst=4 nodelay;
    limit_conn per_ip_conn 2;
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
}

location ^~ /api/v1/site-portal/ { include /etc/nginx/includes/api-proxy.conf; }
location ^~ /api/v1/admin/ { include /etc/nginx/includes/api-proxy.conf; }
location ^~ /api/v1/edge/ { include /etc/nginx/includes/api-proxy.conf; }

location = /api/v1/health { return 404; }
location ^~ /swagger { return 404; }
location ^~ /api/ { return 404; }
location ~ /\. { return 404; }

location ^~ /static/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
}

location = /asset-manifest.json {
    root /usr/share/nginx/html;
    try_files $uri =404;
}

location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
}
