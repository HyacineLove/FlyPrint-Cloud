events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    reset_timedout_connection on;
    
    # 客户端上传文件大小限制（默认 1MB，打印系统设置为 20MB）
    client_max_body_size 10M;

    # WebSocket 升级支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 不记录 Query String，避免令牌进入访问日志；限流字段可由日志采集器计数告警。
    log_format security_audit escape=json '{"time":"$time_iso8601","remote_ip":"$remote_addr",'
                                           '"method":"$request_method","path":"$uri",'
                                           '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
                                           '"rate_limit":"$limit_req_status","connection_limit":"$limit_conn_status"}';

    access_log /var/log/nginx/access.log security_audit;
    error_log /var/log/nginx/error.log;

    # Rate Limiting Zone (10 requests/second per IP)
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=activation_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=entry_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=file_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;
    limit_conn_zone $server_name zone=per_server_conn:10m;

    # 包含其他配置文件
    include /etc/nginx/conf.d/*.conf;
}
